name: Trello Deploy Automation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Trello Card
        id: create_card
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          BRANCH="${{ github.ref_name }}"

          CARD_ID=$(curl --request POST \
            --url "https://api.trello.com/1/cards" \
            --data "idList=${{ secrets.TRELLO_COMMITS_ID }}" \
            --data "name=${COMMIT_MESSAGE}" \
            --data "desc=Author: ${AUTHOR}%0ABranch: ${BRANCH}%0ACommit: ${COMMIT_URL}" \
            --data "key=${{ secrets.TRELLO_API_KEY }}" \
            --data "token=${{ secrets.TRELLO_TOKEN }}" \
            | jq -r '.id')

          echo "CARD_ID=$CARD_ID" >> $GITHUB_ENV

      - name: Fake Deploy
        run: ./deploy.sh

      - name: Move Card to Deployed
        run: |
          curl --request PUT \
            --url "https://api.trello.com/1/cards/${CARD_ID}" \
            --data "idList=${{ secrets.TRELLO_DEPLOYED_ID }}" \
            --data "key=${{ secrets.TRELLO_API_KEY }}" \
            --data "token=${{ secrets.TRELLO_TOKEN }}"
